version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/synapsbranch-ux/yari.run/gen
plugins:
  # Go messages and Connect handlers/clients. Plugins come from go.mod tool directives.
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative
  # TypeScript messages and service descriptors (Connect-ES v2 needs only protoc-gen-es).
  # Run `pnpm install` first so the plugin binary exists.
  - local: packages/api-client/node_modules/.bin/protoc-gen-es
    out: packages/api-client/src/gen
    opt:
      - target=ts
      - import_extension=js
