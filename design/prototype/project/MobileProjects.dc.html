<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile · Projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0B0C10}
a{color:#7C8CFF;text-decoration:none}a:hover{color:#A9B4FF}
*:focus-visible{outline:2px solid #7C8CFF;outline-offset:2px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.hv:hover{background:#181A22 !important}
.hvb:hover{border-color:#2F323D !important}
@keyframes yr-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes yr-spin{to{transform:rotate(360deg)}}
@keyframes yr-shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes yr-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0C10; color: #E8E9EE; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column">

<!-- APP BAR -->
<header style="height: 52px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 8px; border-bottom: 1px solid #24262F; background: #0B0C10; position: relative; z-index: 5">
<button type="button" onClick="{{toggleOrg}}" aria-haspopup="menu" aria-expanded="{{orgOpen}}" title="Switch organization" class="hv" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px; border-radius: 10px; background: transparent; border: none; color: #E8E9EE; cursor: pointer; min-width: 0">
<span style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #181A22; border: 1px solid #24262F; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; box-sizing: border-box">KS</span>
<span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap">Kestrel Studio</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8C8F9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
</button>
<span style="flex: 1"></span>
<button type="button" onClick="{{toggleSearch}}" aria-label="Search projects" aria-expanded="{{searchOpen}}" title="Search projects (⌘K)" class="hv" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; background: transparent; border: none; color: #8C8F9C; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
</button>
<button type="button" aria-label="Account: Lina Pierre" title="Lina Pierre" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; padding: 0">
<span style="width: 30px; height: 30px; border-radius: 50%; background: #181A22; border: 1px solid #24262F; color: #E8E9EE; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box">LP</span>
</button>
</header>

<!-- ORG MENU -->
<sc-if value="{{orgOpen}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{closeOrg}}" aria-label="Close menu" style="position: absolute; left: 0; top: 52px; right: 0; bottom: 0; background: rgba(11,12,16,0.6); border: none; z-index: 8; cursor: default"></button>
<div role="menu" aria-label="Organizations" style="position: absolute; top: 56px; left: 12px; width: 300px; background: #121319; border: 1px solid #24262F; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.45); padding: 6px; z-index: 9; animation: yr-in .14s ease-out">
<div style="padding: 8px 10px 4px; font-size: 11px; font-weight: 500; color: #8C8F9C; letter-spacing: .02em">Organizations</div>
<button type="button" role="menuitemradio" aria-checked="true" onClick="{{closeOrg}}" class="hv" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 10px; border-radius: 8px; background: #181A22; border: none; color: #E8E9EE; cursor: pointer; text-align: left">
<span style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #0B0C10; border: 1px solid #24262F; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; box-sizing: border-box">KS</span>
<span style="display: flex; flex-direction: column; line-height: 1.35"><span style="font-size: 14px; font-weight: 500">Kestrel Studio</span><span style="font-size: 12px; color: #8C8F9C">Organization · 4 members</span></span>
<svg style="margin-left: auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C8CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-label="Current"><path d="M20 6 9 17l-5-5"/></svg>
</button>
<button type="button" role="menuitemradio" aria-checked="false" onClick="{{closeOrg}}" class="hv" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 10px; border-radius: 8px; background: transparent; border: none; color: #E8E9EE; cursor: pointer; text-align: left">
<span style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #0B0C10; border: 1px solid #24262F; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; box-sizing: border-box">LP</span>

</sc-if>

<input id="proj-search" type="search" value="{{query}}" onInput="{{onType}}" placeholder="Project name" autocomplete="off" style="flex: 1; min-width: 0; height: 40px; background: transparent; border: none; outline: none; color: #E8E9EE; font-size: 15px">

</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500">2 plans waiting for you</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #8C8F9C">mango-shop<span aria-hidden="true">·</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E9B949" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Protected"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">production</span></span>
</span>

<!-- workspace filter -->
<div role="group" aria-label="Filter by workspace" style="display: flex; gap: 8px; overflow-x: auto; margin: -6px -16px; padding: 0 16px">
<sc-for list="{{pills}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: none; height: 44px; padding: 0; background: transparent; border: none; cursor: pointer; display: inline-flex; align-items: center"><span style="{{p.style}}">{{p.label}}</span></button>
</sc-for>
</div>

<!-- groups -->
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
<h2 style="margin: 0; font-size: 12px; font-weight: 500; color: #8C8F9C; letter-spacing: .02em">{{g.name}}</h2>

<a href="MobileProject.dc.html" class="hv" aria-label="{{r.aria}}" style="{{r.rowStyle}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 15px; font-weight: 500">{{r.name}}</span>
<sc-if value="{{r.pending}}" hint-placeholder-val="{{ true }}">
<span style="height: 22px; padding: 0 8px; border-radius: 6px; background: rgba(233,185,73,0.12); color: #E9B949; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>2 waiting</span>
</sc-if>
</span>
<span style="display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #8C8F9C">
<sc-if value="{{r.isOnline}}" hint-placeholder-val="{{ true }}"><span style="width: 8px; height: 8px; flex: none; border-radius: 50%; background: #3DD68C"></span></sc-if>
<sc-if value="{{r.isSleeping}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B6F7D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></sc-if>
{{r.summary}}
</span>
<span style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{r.chips}}" as="c" hint-placeholder-count="3">
<span style="height: 22px; padding: 0 8px; border: 1px solid #24262F; border-radius: 6px; font-size: 11px; font-weight: 500; color: #8C8F9C; display: inline-flex; align-items: center">{{c}}</span>
</sc-for>
<sc-if value="{{r.hasMore}}" hint-placeholder-val="{{ true }}">
<span title="{{r.moreTitle}}" style="height: 22px; padding: 0 8px; border-radius: 6px; background: #181A22; font-size: 11px; font-weight: 500; color: #8C8F9C; display: inline-flex; align-items: center">{{r.more}}</span>
</sc-if>
</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C8F9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</a>
</sc-if>
<sc-if value="{{r.isButton}}" hint-placeholder-val="{{ false }}">
<button type="button" class="hv" aria-label="{{r.aria}}" style="{{r.btnStyle}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; font-weight: 500">{{r.name}}</span>
<span style="display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #8C8F9C">
<sc-if value="{{r.isOnline}}" hint-placeholder-val="{{ true }}"><span style="width: 8px; height: 8px; flex: none; border-radius: 50%; background: #3DD68C"></span></sc-if>
<sc-if value="{{r.isSleeping}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B6F7D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></sc-if>
{{r.summary}}
</span>
<span style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{r.chips}}" as="c" hint-placeholder-count="2">
<span style="height: 22px; padding: 0 8px; border: 1px solid #24262F; border-radius: 6px; font-size: 11px; font-weight: 500; color: #8C8F9C; display: inline-flex; align-items: center">{{c}}</span>
</sc-for>
<sc-if value="{{r.hasMore}}" hint-placeholder-val="{{ false }}">
<span title="{{r.moreTitle}}" style="height: 22px; padding: 0 8px; border-radius: 6px; background: #181A22; font-size: 11px; font-weight: 500; color: #8C8F9C; display: inline-flex; align-items: center">{{r.more}}</span>
</sc-if>
</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C8F9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</button>
</sc-if>
</sc-for>
</div>
</section>
</sc-for>

<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 40px 24px">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #181A22; border: 1px solid #24262F; display: inline-flex; align-items: center; justify-content: center; color: #8C8F9C; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
<span style="font-size: 15px; font-weight: 500">No projects match “{{query}}”</span>
<span style="font-size: 13px; color: #8C8F9C">Try another name, or show all workspaces.</span>
<button type="button" onClick="{{resetAll}}" class="hvb" style="height: 44px; padding: 0 16px; border-radius: 10px; background: #181A22; border: 1px solid #24262F; color: #E8E9EE; font-size: 14px; font-weight: 500; cursor: pointer">Show all projects</button>
</div>
</sc-if>

</main>

<!-- BOTTOM TABS -->
<nav aria-label="Main" style="height: 64px; flex: none; display: flex; border-top: 1px solid #24262F; background: #0B0C10; padding: 0 4px">
<a href="MobileProjects.dc.html" aria-current="page" style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #E8E9EE; font-size: 11px; font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C8CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>Projects
</a>
<a href="MobileApprovals.dc.html" aria-label="Approvals, 2 waiting" style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8C8F9C; font-size: 11px; font-weight: 500">
<span style="position: relative; display: inline-flex">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
<span style="position: absolute; top: -5px; right: -9px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #E9B949; color: #0B0C10; font-size: 10px; font-weight: 600; line-height: 16px; text-align: center">2</span>
</span>Approvals
</a>
<a href="MobileAgent.dc.html" style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8C8F9C; font-size: 11px; font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>Agent
</a>
<button type="button" style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8C8F9C; font-size: 11px; font-weight: 500; background: transparent; border: none; cursor: pointer; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Activity
</button>
<button type="button" style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8C8F9C; font-size: 11px; font-weight: 500; background: transparent; border: none; cursor: pointer; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>Settings
</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ws: 'all', orgOpen: false, searchOpen: false, query: '' };
  }
  renderVals() {
    const s = this.state;
    const WS = [
      { id: 'all', label: 'All' },
      { id: 'mango', label: 'Mango Market' },
      { id: 'harbor', label: 'Harbor Clinic' },
      { id: 'internal', label: 'Internal' }
    ];
    const PROJECTS = [
      { ws: 'mango', name: 'mango-shop', summary: 'production · 5/6 online · 1 sleeping', state: 'online', chips: ['Vercel', 'Railway', 'Supabase'], more: '+2', moreTitle: 'Backblaze B2, Resend', pending: true, link: true },
      { ws: 'mango', name: 'mango-admin', summary: 'production · 2/2 services online', state: 'online', chips: ['Vercel', 'Railway'] },
      { ws: 'harbor', name: 'harbor-portal', summary: 'production · 4/4 services online', state: 'online', chips: ['Vercel', 'Railway', 'Supabase'], more: '+1', moreTitle: 'Resend' },
      { ws: 'harbor', name: 'harbor-reminders', summary: 'production · 2/2 online', state: 'online', chips: ['Railway', 'Resend'] },
      { ws: 'internal', name: 'kestrel-site', summary: 'production · 1/1 online', state: 'online', chips: ['Vercel'] },
      { ws: 'internal', name: 'playground', summary: 'staging · 2/2 sleeping', state: 'sleeping', chips: ['Railway'] }
    ];
    const q = s.query.trim().toLowerCase();
    const rowBase = 'display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; min-height: 44px; padding: 14px 12px 14px 16px; color: #E8E9EE; text-align: left; ';
    const groups = WS.filter(w => w.id !== 'all' && (s.ws === 'all' || s.ws === w.id)).map(w => {
      const rows = PROJECTS.filter(p => p.ws === w.id && (!q || p.name.indexOf(q) !== -1)).map((p, i) => {
        const sep = i === 0 ? 'border-top: none; ' : 'border-top: 1px solid #24262F; ';
        return {
          name: p.name,
          summary: p.summary,
          chips: p.chips,
          more: p.more || '',
          moreTitle: p.moreTitle || '',
          hasMore: !!p.more,
          pending: !!p.pending,
          isOnline: p.state === 'online',
          isSleeping: p.state === 'sleeping',
          isLink: !!p.link,
          isButton: !p.link,
          aria: p.name + ', ' + p.summary + (p.pending ? ', 2 plans waiting' : ''),
          rowStyle: rowBase + sep,
          btnStyle: rowBase + sep + 'background: transparent; border-left: none; border-right: none; border-bottom: none; cursor: pointer; font-size: 14px; border-radius: 0;'
        };
      });
      const n = PROJECTS.filter(p => p.ws === w.id).length;
      return { name: w.label, count: n + ' projects', rows: rows };
    }).filter(g => g.rows.length > 0);
    return {
      orgOpen: s.orgOpen,
      toggleOrg: () => this.setState({ orgOpen: !s.orgOpen }),
      closeOrg: () => this.setState({ orgOpen: false }),
      searchOpen: s.searchOpen,
      toggleSearch: () => this.setState({ searchOpen: !s.searchOpen, query: s.searchOpen ? '' : s.query }),
      query: s.query,
      hasQuery: s.query.length > 0,
      onType: (e) => this.setState({ query: e.target.value }),
      clearQuery: () => this.setState({ query: '' }),
      resetAll: () => this.setState({ query: '', ws: 'all' }),
      pills: WS.map(w => {
        const on = s.ws === w.id;
        return {
          label: w.label,
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ ws: w.id }),
          style: 'height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 17px; font-size: 13px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; ' + (on ? 'background: rgba(124,140,255,0.12); border: 1px solid rgba(124,140,255,0.45); color: #E8E9EE;' : 'background: transparent; border: 1px solid #24262F; color: #8C8F9C;')
        };
      }),
      groups: groups,
      noResults: groups.length === 0
    };
  }
}
</script>
</body>
</html>
