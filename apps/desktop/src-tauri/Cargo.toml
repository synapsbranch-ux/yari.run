[package]
name = "yari-desktop"
version = "0.0.0"
description = "yari.run desktop shell (Tauri 2). Hosts the static build of apps/client."
authors = ["yari.run"]
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "yari_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "=2.8.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
